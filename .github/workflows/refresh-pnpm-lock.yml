name: Refresh pnpm lockfile

on:
  push:
    branches:
      - chore/modernize-2026-10
    paths:
      - frontend/package.json
      - frontend/pnpm-lock.yaml
      - frontend/pnpm-workspace.yaml
      - .github/workflows/refresh-pnpm-lock.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/modernize-2026-10
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.8.1 --activate
      - name: Refresh lockfile
        working-directory: frontend
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit lockfile
        run: |
          if git diff --quiet -- frontend/pnpm-lock.yaml; then
            echo "Lockfile is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/pnpm-lock.yaml
          git commit -m "chore: refresh pnpm lockfile"
          git push
